<text x="28" y="69" fill="#fbbf24" font-family="sans-serif" font-size="17">SOURCE DIAGRAM - not a screenshot or screen render</text>
<text x="28" y="110" fill="#7dd3fc" font-family="monospace" font-size="16">SOURCE</text>
<text x="28" y="133" fill="#e5e7eb" font-family="monospace" font-size="16">main/main.c:36293</text>
