<text x="28" y="179" fill="#7dd3fc" font-family="monospace" font-size="16">DIRECT TEXT LITERALS IN THIS FUNCTION</text>
<text x="28" y="202" fill="#e5e7eb" font-family="monospace" font-size="16">ESPShark</text>
<text x="28" y="225" fill="#e5e7eb" font-family="monospace" font-size="16">Capture  |  Inspect  |  Analyze</text>
<text x="28" y="248" fill="#e5e7eb" font-family="monospace" font-size="16">Choose where the capture comes from. Monster view shows what is on the module SD, marks files already</text>
<text x="28" y="271" fill="#e5e7eb" font-family="monospace" font-size="16">copied to Tab5 and can synchronize everything missing.</text>
<text x="28" y="294" fill="#e5e7eb" font-family="monospace" font-size="16">  NEXT: NETWORK HEALTH / THREAT ANALYSIS / Baseline, suspicious DNS, scans, beaconing and worm-like</text>
<text x="28" y="317" fill="#e5e7eb" font-family="monospace" font-size="16">lateral spread. Live stream requires a later JanOS capture protocol.</text>
<text x="28" y="340" fill="#e5e7eb" font-family="monospace" font-size="16"></text>
<text x="28" y="363" fill="#7dd3fc" font-family="monospace" font-size="16">SOURCE DIMENSIONS (UNEVALUATED EXPRESSIONS)</text>
