<text x="28" y="179" fill="#7dd3fc" font-family="monospace" font-size="16">DIRECT TEXT LITERALS IN THIS FUNCTION</text>
<text x="28" y="202" fill="#e5e7eb" font-family="monospace" font-size="16">Screen Lock</text>
