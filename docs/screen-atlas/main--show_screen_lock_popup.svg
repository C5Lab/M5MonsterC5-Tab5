<text x="28" y="248" fill="#e5e7eb" font-family="monospace" font-size="16">Auto-lock on screen off</text>
<text x="28" y="271" fill="#e5e7eb" font-family="monospace" font-size="16">Adds a lock button to the top status bar. / When locked, the screen ignores all taps until / you slide</text>
<text x="28" y="294" fill="#e5e7eb" font-family="monospace" font-size="16">to unlock - prevents accidental clicks. / Auto-lock engages the lock when the screen dims.</text>
