<text x="28" y="225" fill="#e5e7eb" font-family="monospace" font-size="16">Console baud</text>
<text x="28" y="248" fill="#e5e7eb" font-family="monospace" font-size="16">Rate the Monster console is switched to while a file / is copied over Grove or M-BUS. Higher is faster</text>
<text x="28" y="271" fill="#e5e7eb" font-family="monospace" font-size="16">but / depends on the cable: if the switch is not confirmed, / the copy still runs at 115200. / The</text>
