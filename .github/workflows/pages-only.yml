name: Pages Only

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Existing release tag to publish on Pages (defaults to latest release)"
        required: false
  push:
    branches: [main, master]
    paths:
      - "docs/**"
      - "main/**"
      - "tools/ui_emulator/**"
      - "components/**"
      - "managed_components/**"
      - "dependencies/**"
      - "CMakeLists.txt"
      - "post_build.cmake"
      - "dependencies.lock"
      - "lv_conf.h"
      - "partitions.csv"
      - "sdkconfig*"
      - ".github/workflows/pages-only.yml"
      - ".github/workflows/esp32p4-build-master.yml"

concurrency:
  group: github-pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  route:
    name: Select Pages publisher
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    outputs:
      deploy: ${{ steps.select.outputs.deploy }}
      tag: ${{ steps.select.outputs.tag }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Skip when firmware workflow publishes this push
        id: select
        env:
          BASE_SHA: ${{ github.event.before }}
          HEAD_SHA: ${{ github.sha }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          if [ "$GITHUB_EVENT_NAME" != "push" ]; then
            echo "deploy=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          base="$BASE_SHA"
          if [ -z "$base" ] || [ "$base" = "0000000000000000000000000000000000000000" ]; then
            base="$(git rev-parse HEAD~1 2>/dev/null || git rev-parse HEAD)"
          fi
          changed="$(git diff --name-only "$base" "$HEAD_SHA")"
          if grep -qE '^(main/|components/|managed_components/|dependencies/|\.github/scripts/|CMakeLists\.txt$|post_build\.cmake$|dependencies\.lock$|lv_conf\.h$|partitions\.csv$|sdkconfig[^/]*$)' <<< "$changed"; then
            echo "deploy=false" >> "$GITHUB_OUTPUT"
            echo "Firmware workflow will publish Pages after its release."
            exit 0
          fi

          source_version="$(python3 - <<'PY'
          from pathlib import Path
          import re
          source = Path('main/main.c').read_text(encoding='utf-8')
          match = re.search(r'^\s*#define\s+JANOS_TAB_VERSION\s+"([^"]+)"', source, re.MULTILINE)
          if not match:
              raise SystemExit('JANOS_TAB_VERSION not found in main/main.c')
          print(match.group(1))
          PY
          )"
          latest_tag="$(gh api "/repos/${GITHUB_REPOSITORY}/releases/latest" --jq .tag_name)" || {
            echo "::error::Failed to resolve the latest GitHub release tag." >&2
            exit 1
          }
          if [ -z "$latest_tag" ]; then
            echo "::error::Latest GitHub release has no tag." >&2
            exit 1
          fi
          if [ "$latest_tag" != "v${source_version}" ]; then
            echo "deploy=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Skipping Pages-only publish: source version v${source_version} differs from latest release ${latest_tag}. Publish the matching firmware release first."
            exit 0
          fi
          echo "tag=$latest_tag" >> "$GITHUB_OUTPUT"
          echo "deploy=true" >> "$GITHUB_OUTPUT"

  pages:
    name: Deploy Pages Only
    needs: route
    if: needs.route.outputs.deploy == 'true'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    outputs:
      page_url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v4
        with:
          enablement: true

      - name: Resolve release tag
        id: meta
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          INPUT_TAG: ${{ inputs.release_tag }}
          ROUTE_TAG: ${{ needs.route.outputs.tag }}
        run: |
          set -euo pipefail
          if [ "$GITHUB_EVENT_NAME" = "push" ]; then
            TAG="$ROUTE_TAG"
            if [ -z "$TAG" ]; then
              echo "Push has no validated release tag" >&2
              exit 1
            fi
          else
            TAG="${INPUT_TAG:-}"
            if [ -z "$TAG" ]; then
              TAG="$(gh api "/repos/${GITHUB_REPOSITORY}/releases/latest" --jq .tag_name)"
            fi
          fi
          if [ -z "$TAG" ]; then
            echo "Failed to resolve release tag" >&2
            exit 1
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "Using tag: $TAG"

      - name: Download release assets
        id: download
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          TAG="${{ steps.meta.outputs.tag }}"
          rm -rf docs/firmware
          mkdir -p docs/firmware

          gh release download "$TAG" -R "$GITHUB_REPOSITORY" --dir docs/firmware \
            --pattern "bootloader.bin" \
            --pattern "partition-table.bin" \
            --pattern "M5MonsterC5-Tab5.bin" \
            --pattern "M5MonsterC5-Tab5-*.bin"

          ls -lh docs/firmware

          fw_version="${TAG#v}"
          app_bin="docs/firmware/M5MonsterC5-Tab5-${fw_version}.bin"
          if [ ! -f "$app_bin" ]; then
            echo "Missing app-only firmware $app_bin in release assets for tag ${TAG}" >&2
            exit 1
          fi
          cp "$app_bin" docs/firmware/M5MonsterC5-Tab5.bin

          for f in bootloader.bin partition-table.bin M5MonsterC5-Tab5.bin; do
            if [ ! -f "docs/firmware/$f" ]; then
              echo "Missing $f in release assets for tag ${TAG}" >&2
              exit 1
            fi
          done

          echo "fw_version=$fw_version" >> "$GITHUB_OUTPUT"

      - name: Build manifest.json
        env:
          FW_VERSION: ${{ steps.download.outputs.fw_version }}
          BUILD_TAG: ${{ steps.meta.outputs.tag }}
        run: |
          set -euo pipefail
          python -c "import os, json; from pathlib import Path; version=os.getenv('FW_VERSION') or os.getenv('BUILD_TAG'); build=os.getenv('BUILD_TAG', 'manual'); manifest={'name':'M5MonsterC5-Tab5 ESP32-P4','version':version,'build':build,'chipFamily':'ESP32-P4','parts':[{'path':'firmware/bootloader.bin','offset':8192},{'path':'firmware/partition-table.bin','offset':32768},{'path':'firmware/M5MonsterC5-Tab5.bin','offset':65536}]}; Path('docs/manifest.json').write_text(json.dumps(manifest, indent=2), encoding='utf-8')"

      - name: Build browser emulator
        run: bash tools/ui_emulator/build.sh

      - name: Stage browser emulator
        run: |
          set -euo pipefail
          test -s tools/ui_emulator/dist/index.html
          test -s tools/ui_emulator/dist/emulator.wasm
          mkdir -p docs/emulator
          cp -R tools/ui_emulator/dist/. docs/emulator/
          test -s docs/emulator/index.html
          test -s docs/emulator/emulator.wasm

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
